name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run the non-live tests
        run: docker compose -f compose.test.yaml run --rm --build tests
      - name: Stop the test stack
        if: always()
        run: docker compose -f compose.test.yaml down -v

  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Create .env from the example
        run: cp .env.example .env
      - name: Start the stack and run one run per bot
        # The arcaptcha run uses the live site and may end `blocked`. See DECISIONS.md 7c.
        run: .github/scripts/smoke.sh
      - name: Show the logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop and delete the stack
        if: always()
        run: docker compose down -v
