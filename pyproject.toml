[project]
name = "botplatform"
version = "0.1.0"
description = "An extensible platform for defining, running and monitoring browser bots"
readme = "README.md"
authors = [
    { name = "Alireza Ahani", email = "alirezaahani1386@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
    "websockets>=13",
]
worker = [
    "selenium>=4.25",
]
# The automatic solver's gap finder (OpenCV without a GUI, plus numpy).
solver = [
    "opencv-python-headless>=5.0.0.93",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests need the real site, so they only run with `-m live`.
# No cache: /app belongs to root and the tests run as user `app`.
addopts = "-m 'not live' -p no:cacheprovider"
markers = [
    "live: runs against the real demo.arcaptcha.co, not the local fake",
    "browser: drives real Chrome against the fake demo (marked automatically in conftest.py)",
]
