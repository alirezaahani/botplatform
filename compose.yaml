x-database-env: &database-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?set it in .env}:${POSTGRES_PASSWORD:?set it in .env}@db:5432/${POSTGRES_DB:?set it in .env}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set it in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set it in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      target: web
    command: ["alembic", "upgrade", "head"]
    environment: *database-env
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    environment: *database-env
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    init: true
    environment:
      <<: *database-env
      RUN_TIME_LIMIT_SECONDS: ${RUN_TIME_LIMIT_SECONDS:-180}
      ARCAPTCHA_USERNAME: ${ARCAPTCHA_USERNAME:?set it in .env}
      ARCAPTCHA_PASSWORD: ${ARCAPTCHA_PASSWORD:?set it in .env}
    shm_size: 1gb
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
