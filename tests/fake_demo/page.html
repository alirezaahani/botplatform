<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Fake ARCaptcha demo (not the real site)</title></head>
<body>
  <h1>Fake demo page</h1>
  <form id="login-form" autocomplete="off">
    <div id="widget">
      <div id="input-checkbox" style="width:24px;height:24px;border:2px solid #555"></div>
      <input type="hidden" id="arcaptcha-token" name="arcaptcha-token">
      <div id="widget-message"></div>
    </div>
    <p><input id="email" type="email" name="email"></p>
    <p><input id="password" type="password" name="password"></p>
    <p><button>Login</button></p>
  </form>
  <div id="toasts" style="position:fixed;top:10px;right:10px"></div>
  <script>
    const CONFIG = __CONFIG__;
    let challengeId = null;

    // The same cipher as botplatform/bots/arcaptcha/codec.py. Plain JSON is accepted too.
    function decode(buffer) {
      try {
        return JSON.parse(new TextDecoder('utf-8', {fatal: true}).decode(buffer));
      } catch (plainError) { /* not plain JSON, so it should be obfuscated */ }
      const t = new Uint8Array(buffer);
      let [e, r, n, o] = t;
      let s = 90;
      const out = [];
      for (const p of t.subarray(4)) {
        e = (e + r) & 255;
        r = (r ^ n) & 255;
        n = (n + o) & 255;
        o = (o ^ e) & 255;
        out.push(((((p >>> 3) | (p << 5)) & 255) - s & 255) ^ ((e + o) & 255));
        s = p;
      }
      const padding = out[out.length - 1];
      const body = out.slice(0, out.length - 1 - padding);
      return JSON.parse(new TextDecoder().decode(new Uint8Array(body)));
    }

    function say(text, color) {
      const el = document.createElement('div');
      el.className = 'widget-message';
      el.style.color = color || 'black';
      el.textContent = text;
      document.getElementById('widget-message').appendChild(el);
    }

    function showPopup(text) {
      const old = document.getElementById('challenge');
      if (old) old.remove();
      const popup = document.createElement('div');
      popup.id = 'challenge';
      popup.style.cssText = 'width:300px;height:150px;border:1px solid #999';
      popup.textContent = text;
      if (text === 'puzzle') {
        // Like the real widget: a background image and, in an absolutely positioned div, the piece.
        const base = CONFIG.api_origin + '/arcaptcha/api/puzzles/' + challengeId + '/undefined/';
        const wrapper = document.createElement('div');
        wrapper.style.cssText = 'position:relative;width:260px;height:160px';
        wrapper.innerHTML = '<img src="' + base + 'background" style="width:260px;height:160px">'
          + '<div style="position:absolute;left:0;top:0"><img draggable="true" class="x puzzle" '
          + 'src="' + base + 'piece" style="position:absolute;left:0px;top:' + ((CONFIG.puzzle || {}).top || 20) + 'px;width:'
          + (CONFIG.puzzle ? 50 : 40) + 'px"></div>';
        popup.appendChild(wrapper);
        if (CONFIG.slider !== null) addSlider(popup, wrapper.querySelector('img.puzzle'));
      }
      document.body.appendChild(popup);
    }

    // A handle that drags the piece by mouse events: piece left = handle left * CONFIG.slider.
    // The handle stops at 196 px and the piece at 210 px, like the real widget seems to.
    let ignored = 0;  // presses ignored so far, over the whole page
    function addSlider(popup, piece) {
      const track = document.createElement('div');
      track.style.cssText = 'position:relative;width:260px;height:44px;user-select:none';
      const handle = document.createElement('div');
      handle.className = 'tw-absolute tw-rounded-full tw-w-16 tw-h-10 tw-left-0 tw-bottom-1 draggable';
      handle.style.cssText = 'position:absolute;left:0px;top:2px;width:64px;height:40px;'
        + 'border-radius:20px;background:#39c';
      track.appendChild(handle);
      popup.appendChild(track);
      let startX = null;
      handle.addEventListener('mousedown', (event) => {
        if (ignored < CONFIG.ignore_presses) { ignored += 1; return; }  // not ready yet
        startX = event.clientX - parseFloat(handle.style.left);
        event.preventDefault();
      });
      document.addEventListener('mousemove', (event) => {
        if (startX === null) return;
        const left = Math.max(0, Math.min(196, event.clientX - startX));
        handle.style.left = left + 'px';
        piece.style.left = Math.min(210, left * CONFIG.slider) + 'px';
      });
      document.addEventListener('mouseup', () => {
        if (startX === null) return;
        startX = null;
        sendAnswer(Math.round(parseFloat(piece.style.left)));
      });
    }

    function sendAnswer(position) {
      const xhr = new XMLHttpRequest();
      xhr.open('POST', CONFIG.api_origin + '/arcaptcha/api/answer');
      xhr.setRequestHeader('Content-Type', 'application/json');
      xhr.responseType = 'arraybuffer';
      xhr.onload = () => {
        let data = {};
        try { data = decode(xhr.response); } catch (error) { /* unreadable: the page stays put */ }
        if (data.accepted === false || data.success === false) sendCreate();  // a rejected answer brings a new puzzle
      };
      xhr.send(JSON.stringify({challenge_id: challengeId, answer: typeof position === 'number' ? position : 42}));
    }

    function handleCreate(status, buffer) {
      let data;
      if (status >= 400) {
        let message = 'Error ' + status;
        try {
          const body = decode(buffer);
          message = body.message || body.msg || message;
        } catch (error) { /* keep the generic message */ }
        if (status === 422) { alert(message); } else { say(message, 'red'); }
        return;
      }
      try { data = decode(buffer); } catch (error) { say('Cannot read the response', 'red'); return; }
      const content = data.content || {};
      if (data.captcha_type === 'block') {
        document.getElementById('input-checkbox').style.display = 'none';
        say('Blocked! Are you robot? Please refresh the page and try again', 'red');
        return;  // like the real widget, a blocked run never stores its ID
      }
      if (content.challenge_id) {
        challengeId = content.challenge_id;
        document.getElementById('arcaptcha-token').value = challengeId;
      }
      if (data.captcha_type === 'puzzle') showPopup('puzzle');
      if (data.captcha_type === 'question') showPopup('question');
      if (content.softban) say(content.message, 'red');
    }

    function sendCreate(then) {
      const xhr = new XMLHttpRequest();
      xhr.open('POST', CONFIG.api_origin + '/arcaptcha/api/create');
      xhr.setRequestHeader('Content-Type', 'application/json');  // forces a CORS preflight
      xhr.responseType = 'arraybuffer';
      xhr.onload = () => { handleCreate(xhr.status, xhr.response); if (then) then(); };
      xhr.send(JSON.stringify({site_key: 'fake'}));
    }

    document.getElementById('input-checkbox').addEventListener('click', () => {
      sendCreate(CONFIG.second_create ? () => sendCreate() : null);
      if (CONFIG.alert_on_click) alert(CONFIG.alert_on_click);
    });

    function toast(kind, text) {
      const el = document.createElement('div');
      el.className = 'Vue-Toastification__toast Vue-Toastification__toast--' + kind;
      el.style.cssText = 'background:#eee;padding:8px;margin:4px';
      document.getElementById('toasts').appendChild(el);
      // The real toast animates in, so it exists a moment before its text does.
      setTimeout(() => { el.textContent = text; }, 100);
    }

    document.getElementById('login-form').addEventListener('submit', (event) => {
      event.preventDefault();
      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/login');
      xhr.setRequestHeader('Content-Type', 'application/json');
      xhr.onload = () => {
        let msg = null;
        try { msg = JSON.parse(xhr.responseText).msg; } catch (error) { /* no message */ }
        if (CONFIG.toast.none) return;
        const kind = CONFIG.toast.kind || (xhr.status === 200 ? 'success' : 'error');
        const text = CONFIG.toast.text !== null ? CONFIG.toast.text : (msg || 'Done');
        setTimeout(() => toast(kind, text), 100);
      };
      xhr.send(JSON.stringify({
        username: document.getElementById('email').value,
        password: document.getElementById('password').value,
        captcha_token: document.getElementById('arcaptcha-token').value,
      }));
    });
  </script>
</body>
</html>
